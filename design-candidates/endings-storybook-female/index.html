<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>아직 적용 안 한 일러스트</title><style>body{margin:0;background:#101321;color:#f5ebd7;font:16px/1.6 system-ui}main{max-width:1700px;margin:auto;padding:32px}h1{font-size:28px}section{margin:48px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}figure{margin:0;background:#22263b;border-radius:12px;overflow:hidden}img{display:block;width:100%;aspect-ratio:3/2;object-fit:contain}figcaption{padding:14px}a{color:#eed397}button{padding:12px 20px;border:0;border-radius:8px;background:#eed397;cursor:pointer}#result{white-space:pre-wrap}@media(max-width:850px){.grid{grid-template-columns:1fr}}</style><main><h1>아직 적용 안 한 일러스트</h1><p>5개 엔딩 × 3개 후보. 기존 구도를 유지하며 보내주신 동화책의 색연필·파스텔 질감을 참고했습니다.<br>이미지를 누르면 원본이 열립니다. 아직 게임에는 적용하지 않았습니다.</p><section><h2>1. 새로운 키퍼</h2><div class="grid"><figure><a href="ending-1-1.png" target="_blank"><img src="ending-1-1.png" alt="새로운 키퍼 1안" loading="lazy"></a><figcaption><label><input type="radio" name="ending1" value="1"> 1안</label></figcaption></figure><figure><a href="ending-1-2.png" target="_blank"><img src="ending-1-2.png" alt="새로운 키퍼 2안" loading="lazy"></a><figcaption><label><input type="radio" name="ending1" value="2"> 2안</label></figcaption></figure><figure><a href="ending-1-3.png" target="_blank"><img src="ending-1-3.png" alt="새로운 키퍼 3안" loading="lazy"></a><figcaption><label><input type="radio" name="ending1" value="3"> 3안</label></figcaption></figure></div></section><section><h2>2. 새벽의 출구</h2><div class="grid"><figure><a href="ending-2-1.png" target="_blank"><img src="ending-2-1.png" alt="새벽의 출구 1안" loading="lazy"></a><figcaption><label><input type="radio" name="ending2" value="1"> 1안</label></figcaption></figure><figure><a href="ending-2-2.png" target="_blank"><img src="ending-2-2.png" alt="새벽의 출구 2안" loading="lazy"></a><figcaption><label><input type="radio" name="ending2" value="2"> 2안</label></figcaption></figure><figure><a href="ending-2-3.png" target="_blank"><img src="ending-2-3.png" alt="새벽의 출구 3안" loading="lazy"></a><figcaption><label><input type="radio" name="ending2" value="3"> 3안</label></figcaption></figure></div></section><section><h2>3. 끝나지 않는 왈츠</h2><div class="grid"><figure><a href="ending-3-1.png" target="_blank"><img src="ending-3-1.png" alt="끝나지 않는 왈츠 1안" loading="lazy"></a><figcaption><label><input type="radio" name="ending3" value="1"> 1안</label></figcaption></figure><figure><a href="ending-3-2.png" target="_blank"><img src="ending-3-2.png" alt="끝나지 않는 왈츠 2안" loading="lazy"></a><figcaption><label><input type="radio" name="ending3" value="2"> 2안</label></figcaption></figure><figure><a href="ending-3-3.png" target="_blank"><img src="ending-3-3.png" alt="끝나지 않는 왈츠 3안" loading="lazy"></a><figcaption><label><input type="radio" name="ending3" value="3"> 3안</label></figcaption></figure></div></section><section><h2>4. 마지막 좌석</h2><div class="grid"><figure><a href="ending-4-1.png" target="_blank"><img src="ending-4-1.png" alt="마지막 좌석 1안" loading="lazy"></a><figcaption><label><input type="radio" name="ending4" value="1"> 1안</label></figcaption></figure><figure><a href="ending-4-2.png" target="_blank"><img src="ending-4-2.png" alt="마지막 좌석 2안" loading="lazy"></a><figcaption><label><input type="radio" name="ending4" value="2"> 2안</label></figcaption></figure><figure><a href="ending-4-3.png" target="_blank"><img src="ending-4-3.png" alt="마지막 좌석 3안" loading="lazy"></a><figcaption><label><input type="radio" name="ending4" value="3"> 3안</label></figcaption></figure></div></section><section><h2>5. 우리가 설계할 내일</h2><div class="grid"><figure><a href="ending-5-1.png" target="_blank"><img src="ending-5-1.png" alt="우리가 설계할 내일 1안" loading="lazy"></a><figcaption><label><input type="radio" name="ending5" value="1"> 1안</label></figcaption></figure><figure><a href="ending-5-2.png" target="_blank"><img src="ending-5-2.png" alt="우리가 설계할 내일 2안" loading="lazy"></a><figcaption><label><input type="radio" name="ending5" value="2"> 2안</label></figcaption></figure><figure><a href="ending-5-3.png" target="_blank"><img src="ending-5-3.png" alt="우리가 설계할 내일 3안" loading="lazy"></a><figcaption><label><input type="radio" name="ending5" value="3"> 3안</label></figcaption></figure></div></section><button onclick="show()">선택 목록 보기</button><p id="result"></p></main><script>function show(){const names=["새로운 키퍼","새벽의 출구","끝나지 않는 왈츠","마지막 좌석","우리가 설계할 내일"];document.querySelector('#result').textContent=names.map((n,i)=>n+' '+(document.querySelector('input[name=ending'+(i+1)+']:checked')?.value||'미선택')).join(' / ')}</script></html>
