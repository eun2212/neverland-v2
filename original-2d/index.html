  if(who.startsWith('ENDING'))return ({1:'11',2:'15',3:'04',4:'10',5:'13'})[s.ending]||'00';
  if(who!=='키퍼')return null;
  if(text.includes('깨어나셨군요'))return '15';
  if(text.includes('…돌아오셨네요'))return '06';
  if(text.includes('이제 타세요')||text.includes('질문은 그 정도'))return '09';
  if(text.includes('간신히')||text.includes('위험해요'))return '07';
  if(text.includes('안전 장치를 잡아'))return '13';
  if(text.includes('정확해요'))return '02';
  if(text.includes('무사히 다녀'))return '12';
  if(text.includes('궁금한 게'))return '03';
  if(text.includes('그 이야기를 기억'))return '04';
  if(text.includes('그 배에서 죽었'))return '11';
  if(text.includes('가면을 건넸')||text.includes('손님이었을'))return '10';
  if(text.includes('키퍼가 없는')||text.includes('문이 출구')||text.includes('정말로 나가'))return '08';
  if(text.includes('설계자가 되고'))return '04';
  if(text.includes('당신이 이겼'))return '12';
  if(text.includes('잃고 싶지'))return '07';
  if(text.includes('기억을 되찾아'))return '11';
  if(text.includes('아직 제 족쇄')||text.includes('당신을 놓아주지'))return '10';
  if(text.includes('기억이 부족')||text.includes('하지 못한 이야기'))return '07';
  if(text.includes('다음 놀이기구')||text.includes('출구요')||text.includes('구역마다 길')||text.includes('금빛 눈금')||text.includes('하늘에 별')||text.includes('목마는')||text.includes('문에 새겨진')||text.includes('찻잔의 색'))return '14';
  if(text.includes('붉은 레버'))return '08';
  if(text.includes('즐거운 항해'))return '01';
  return '01';
}

function diceEvent(done){close();s.phase='event';log('dice');say('키퍼','가기 전에 작은 주사위 놀이를 할까요? 높은 숫자가 나온 사람이 이겨요.',[['주사위를 굴린다',()=>rollDice(done)],['다음 기구로 간다',done]])}
function rollDice(done){const player=1+Math.floor(Math.random()*6),keeper=1+Math.floor(Math.random()*6);log('dice:'+player+':'+keeper);const won=player>keeper;if(won){s.K+=2;s.escapeBonus+=2;s.diceWins++;log('dice-win')}const result=won?'와앙, 짝짝짝! 당신이 이겼어요! 함께 노는 게 이렇게 즐거웠네요.':player===keeper?'같은 숫자네요! 무승부도 꽤 귀엽죠?':'이번에는 제가 이겼네요. 같이 놀아 줘서 고마워요.';modal('<div class="eyebrow">NEVERLAND / DICE</div><h1>두 사람의 주사위</h1><div class="dice-pair"><div><span class="die">'+['','⚀','⚁','⚂','⚃','⚄','⚅'][player]+'</span><p>'+s.name.replace(/[<>&]/g,'')+' · '+player+'</p></div><div><span class="die">'+['','⚀','⚁','⚂','⚃','⚄','⚅'][keeper]+'</span><p>키퍼 · '+keeper+'</p></div></div><p>'+result+'</p><button id="diceContinue">계속 →</button>');$('diceContinue').onclick=()=>{close();if(won)showEventArt('diceWin');story([['키퍼',result]],done)}}


function captainSceneMarkup(){return '<div id="captainVisual" class="captain-visual" data-step="0"><svg viewBox="0 0 900 360" role="img" aria-label="레버에 반응하는 캡틴 훅 출발 장면"><defs><linearGradient id="cSky" x2="0" y2="1"><stop stop-color="#21434b"/><stop offset="1" stop-color="#9da998"/></linearGradient><linearGradient id="cSea" x2="0" y2="1"><stop stop-color="#659d9c"/><stop offset="1" stop-color="#254f57"/></linearGradient><linearGradient id="cWood" x2="0" y2="1"><stop stop-color="#bd8650"/><stop offset="1" stop-color="#533326"/></linearGradient></defs><rect width="900" height="360" fill="url(#cSky)"/><g class="captain-horizon" opacity=".7"><path d="M0 195Q100 140 180 180T360 155T550 182T760 158T900 175V240H0Z" fill="#416c64"/><path d="M30 180V130H60V180M790 180V115H820V180" stroke="#acb19a" stroke-width="12"/><circle cx="680" cy="95" r="50" fill="none" stroke="#d4be90" stroke-width="3"/><path d="M630 95H730M680 45V145M645 60L715 130M645 130L715 60" stroke="#d4be90" stroke-width="2"/></g><rect y="218" width="900" height="142" fill="url(#cSea)"/><g class="captain-water" stroke="#aacac2" stroke-width="3" opacity=".45"><path d="M0 254Q90 236 180 254T360 254T540 254T720 254T900 254M-70 295Q20 277 110 295T290 295T470 295T650 295T830 295" fill="none"/></g><path d="M145 335L350 25H550L755 335" fill="none" stroke="#665441" stroke-width="24"/><path d="M145 335L350 25H550L755 335" fill="none" stroke="#c49d62" stroke-width="5"/><path d="M310 35H590" stroke="#352b23" stroke-width="20"/><g class="captain-boat"><path d="M365 45L315 223M535 45L590 223" stroke="#c4bba4" stroke-width="5" stroke-dasharray="9 5"/><path d="M238 215Q450 282 663 215L638 265Q460 343 268 266Z" fill="url(#cWood)" stroke="#412d24" stroke-width="5"/><path d="M240 214Q450 277 660 214" fill="none" stroke="#dfb77c" stroke-width="10"/><path d="M270 225V184H310V239M590 238V181H630V224" fill="none" stroke="#c79454" stroke-width="7"/><path d="M450 248V115" stroke="#66432a" stroke-width="8"/><path d="M455 116Q510 135 533 105V151Q499 170 455 155Z" fill="#9d3c38"/><g fill="#dbb870" stroke="#684e32" stroke-width="3"><circle cx="330" cy="261" r="11"/><circle cx="390" cy="279" r="11"/><circle cx="455" cy="284" r="11"/><circle cx="520" cy="278" r="11"/><circle cx="581" cy="260" r="11"/></g><g class="captain-lights" fill="#fff1a2"><circle cx="270" cy="222" r="4"/><circle cx="310" cy="234" r="4"/><circle cx="355" cy="246" r="4"/><circle cx="402" cy="253" r="4"/><circle cx="450" cy="256" r="4"/><circle cx="498" cy="253" r="4"/><circle cx="545" cy="245" r="4"/><circle cx="590" cy="234" r="4"/><circle cx="633" cy="222" r="4"/></g></g><path d="M0 333H900V360H0Z" fill="#534735"/><path d="M0 334H900" stroke="#c5a66d" stroke-width="5"/></svg><div class="captain-status"><span id="captainState">STOP · 대기</span><span id="captainPower">추진력 0%</span></div><div class="captain-steps"><span id="captainStep0">대기</span><span id="captainStep1">점등</span><span id="captainStep2">흔들림</span><span id="captainStep3">출항</span></div><div class="captain-lever-track"><div id="captainHandle" class="captain-handle"><i></i></div><span>STOP</span><span>GO →</span></div></div>'}
function updateCaptainMotion(value){const v=Math.max(0,Math.min(100,Number(value)||0)),step=v<25?0:v<50?1:v<75?2:3;const visual=$('captainVisual');visual.dataset.step=String(step);const set=(name,value)=>{if(visual.style.setProperty)visual.style.setProperty(name,value);else visual.style[name]=value};set('--swing',(v<50?0:(v-50)*.22)+'deg');set('--swing-negative',(v<50?0:-(v-50)*.22)+'deg');set('--sway-time',(3.8-v*.023)+'s');set('--lights',v<25?'.08':'1');set('--power',v+'%');$('captainHandle').style.left=(8+v*.84)+'%';$('captainHandle').style.transform='translateX(-50%) rotate('+(-35+v*.7)+'deg)';$('captainState').textContent=['STOP · 배가 정박해 있어요','LIGHT · 갑판의 조명이 켜집니다','SWING · 배가 천천히 흔들립니다','SAIL · 사슬이 당겨지고 배가 출항합니다'][step];$('captainPower').textContent='추진력 '+v+'%';for(let i=0;i<4;i++)$('captainStep'+i).classList.toggle('active',i<=step)}


function openRideGame(){s.phase='puzzle';showKeeperPose('08');puzzle={sequence:[],colors:new Set(),failed:false};modal('<div class="eyebrow">'+rides[s.ride].name+' / CONTROL DESK</div><h1>'+['','星 별자리 회전판','♪ 목마의 오르골','◇ 거울의 빛길','☕ 찻잔의 회전판'][s.ride]+'</h1><p id="hint"></p><div id="rideCanvas" class="ride-canvas"></div><div id="controls"></div><p id="feedback" role="status">장치를 움직여 놀이기구를 깨워 주세요.</p><div id="puzzleActions"></div>');if(s.ride===1)setupStars();if(s.ride===2)setupMusic();if(s.ride===3)setupMirrors();if(s.ride===4)setupCups();$('puzzleActions').append(btn('작동 확인',verify),btn('막혔어요 · 도움 요청',offerHelp),btn('데크로 돌아가기',()=>{close();hub()}))}
function setupStars(){puzzle.offsets=[1,2,3].map(()=>1+Math.floor(Math.random()*7));puzzle.rotations=[0,0,0];$('hint').textContent='각 원판을 돌려 달·별·태양을 위쪽 금빛 표시에 맞추세요. 세 기호가 한 줄로 모이면 관람차가 움직입니다.';$('rideCanvas').innerHTML='<div class="star-wheel"><div class="alignment-mark">▼</div>'+['☾','✦','☀'].map((symbol,i)=>'<div id="starRing'+i+'" class="star-ring ring-'+i+'"><span>'+symbol+'</span></div>').join('')+'<div class="wheel-hub">✧</div></div>';$('controls').innerHTML=['달','별','태양'].map((name,i)=>'<label for="starDial'+i+'">'+name+' 원판</label><input id="starDial'+i+'" type="range" min="0" max="7" value="0" step="1">').join('');for(let i=0;i<3;i++)$('starDial'+i).oninput=e=>{puzzle.rotations[i]=+e.target.value;renderStars()};renderStars()}
function renderStars(){let aligned=0;for(let i=0;i<3;i++){const angle=((puzzle.offsets[i]+puzzle.rotations[i])%8)*45;$('starRing'+i).style.transform='rotate('+angle+'deg)';if(angle===0)aligned++}$('feedback').textContent='정렬된 별자리 '+aligned+' / 3';$('rideCanvas').dataset.ready=String(aligned===3)}
function setupMusic(){const pool=['도','미','솔','라'];puzzle.melody=Array.from({length:4},()=>pool[Math.floor(Math.random()*pool.length)]);$('hint').textContent='악보의 네 음을 왼쪽부터 연주하세요. 음마다 목마가 반짝입니다. 잘못 눌렀다면 처음부터 다시 연주할 수 있어요.';$('rideCanvas').innerHTML='<div class="carousel-canopy">✦ 장미 오르골 ✦</div><div class="carousel-horses">♞ ♞ ♞</div><div class="music-score">'+puzzle.melody.map((note,i)=>'<span id="scoreNote'+i+'">♪<b>'+note+'</b></span>').join('')+'</div>';$('controls').className='piano-keys';for(const note of ['도','레','미','파','솔','라','시'])$('controls').append(btn(note,()=>playRideNote(note)));$('controls').append(btn('처음부터',()=>{puzzle.sequence=[];renderMusic()}));renderMusic()}
function playRideNote(note){if(puzzle.sequence.length>=4)return;puzzle.sequence.push(note);if(typeof window!=='undefined'){try{const AC=window.AudioContext||window.webkitAudioContext;if(AC){rideAudio=rideAudio||new AC();const oscillator=rideAudio.createOscillator(),gain=rideAudio.createGain();oscillator.frequency.value=({도:261.63,레:293.66,미:329.63,파:349.23,솔:392,라:440,시:493.88})[note];gain.gain.setValueAtTime(.08,rideAudio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,rideAudio.currentTime+.32);oscillator.connect(gain);gain.connect(rideAudio.destination);oscillator.start();oscillator.stop(rideAudio.currentTime+.34)}}catch(e){}}renderMusic()}
let rideAudio=null;
function renderMusic(){for(let i=0;i<4;i++)$('scoreNote'+i).classList.toggle('played',puzzle.sequence[i]===puzzle.melody[i]);$('feedback').textContent='연주: '+(puzzle.sequence.join(' → ')||'건반을 눌러 주세요');$('rideCanvas').dataset.ready=String(puzzle.sequence.join(',')===puzzle.melody.join(','))}
function setupMirrors(){puzzle.tileTypes=['L','I','L','L','L','L','I','L','I'];puzzle.turns=Array.from({length:9},()=>Math.floor(Math.random()*4));$('hint').textContent='거울을 누르면 90° 돌아갑니다. 왼쪽 입구에서 들어오는 빛을 오른쪽 출구까지 연결하세요. 빛이 이어진 거울은 금빛으로 표시됩니다.';$('rideCanvas').innerHTML='<div class="mirror-labels"><span>빛 입구 →</span><span>→ 출구</span></div><div class="mirror-grid">'+puzzle.tileTypes.map((type,i)=>'<button id="mirrorTile'+i+'" aria-label="거울 '+(i+1)+' 회전"><svg viewBox="0 0 100 100"><path d="'+(type==='L'?'M50 0V50H100':'M50 0V100')+'"/></svg></button>').join('')+'</div>';$('controls').append(btn('거울 초기화',()=>{puzzle.turns=Array(9).fill(0);renderMirrors()}));for(let i=0;i<9;i++)$('mirrorTile'+i).onclick=()=>{puzzle.turns[i]=(puzzle.turns[i]+1)%4;renderMirrors()};renderMirrors()}
function traceMirrors(){let cell=3,entry=3;const lit=[],seen=new Set();while(!seen.has(cell)){seen.add(cell);const edges=(puzzle.tileTypes[cell]==='L'?[0,1]:[0,2]).map(d=>(d+puzzle.turns[cell])%4);if(!edges.includes(entry))return {lit,won:false};lit.push(cell);const out=edges.find(d=>d!==entry),r=Math.floor(cell/3),c=cell%3;if(cell===5&&out===1)return {lit,won:true};const nr=r+[-1,0,1,0][out],nc=c+[0,1,0,-1][out];if(nr<0||nr>2||nc<0||nc>2)return {lit,won:false};cell=nr*3+nc;entry=(out+2)%4}return {lit,won:false}}
function renderMirrors(){const result=traceMirrors();for(let i=0;i<9;i++){$('mirrorTile'+i).style.setProperty?.('--turn',puzzle.turns[i]*90+'deg');$('mirrorTile'+i).classList.toggle('lit',result.lit.includes(i));$('mirrorTile'+i).setAttribute('aria-label','거울 '+(i+1)+' 회전 · '+puzzle.turns[i]*90+'도')}$('feedback').textContent=result.won?'빛이 출구에 닿았어요!':'연결된 거울 '+result.lit.length+'개 · 빛의 길을 이어 주세요';$('rideCanvas').dataset.ready=String(result.won)}
function setupCups(){puzzle.speed=0;$('hint').textContent='빨강과 파랑을 섞어 보라색 찻잔을 만들고, 회전 속도를 금빛 안전 구간(45~65)에 맞추세요. 색과 속도가 모두 맞아야 출발합니다.';$('rideCanvas').innerHTML='<div class="cup-platform" id="cupPlatform"><div class="teapot">☾</div><div class="cup cup-a">✦</div><div class="cup cup-b">✦</div><div class="cup cup-c">✦</div></div><div class="speed-meter"><i id="speedNeedle"></i><span>정지</span><span>안전 구간</span><span>과속</span></div>';$('controls').innerHTML='<div id="paintButtons" class="paint-buttons"></div><label for="cupSpeed">찻잔 회전 속도</label><input id="cupSpeed" type="range" min="0" max="100" value="0">';for(const [name,color] of [['빨강','#b95161'],['파랑','#568cc7'],['노랑','#d4b255']]){const b=btn(name,()=>{puzzle.colors.has(name)?puzzle.colors.delete(name):puzzle.colors.add(name);b.setAttribute('aria-pressed',String(puzzle.colors.has(name)));renderCups()});b.style.background=color;b.setAttribute('aria-pressed','false');$('paintButtons').append(b)}$('cupSpeed').oninput=e=>{puzzle.speed=+e.target.value;renderCups()};renderCups()}
function renderCups(){const purple=puzzle.colors.size===2&&puzzle.colors.has('빨강')&&puzzle.colors.has('파랑'),color=purple?'#a58bbd':puzzle.colors.has('노랑')?'#d4b255':puzzle.colors.has('빨강')?'#b95161':puzzle.colors.has('파랑')?'#568cc7':'#e1d4b8';$('cupPlatform').style.setProperty?.('--cup-color',color);$('cupPlatform').style.setProperty?.('--spin-time',Math.max(1.2,12-puzzle.speed*.1)+'s');$('cupPlatform').dataset.spinning=String(puzzle.speed>0);$('speedNeedle').style.left=puzzle.speed+'%';const safe=puzzle.speed>=45&&puzzle.speed<=65;$('feedback').textContent='색: '+(purple?'보라':puzzle.colors.size?[...puzzle.colors].join('+'):'미선택')+' · 속도 '+puzzle.speed+' · '+(safe?'안전 구간':puzzle.speed>65?'너무 빨라요':'조금 더 돌려 주세요');$('rideCanvas').dataset.ready=String(purple&&safe)}
function rideGameSolved(){return s.ride===1?puzzle.rotations.every((v,i)=>(v+puzzle.offsets[i])%8===0):s.ride===2?puzzle.sequence.join(',')===puzzle.melody.join(','):s.ride===3?traceMirrors().won:puzzle.colors.size===2&&puzzle.colors.has('빨강')&&puzzle.colors.has('파랑')&&puzzle.speed>=45&&puzzle.speed<=65}
function verifyRideGame(){if(rideGameSolved())success(false);else{puzzle.failed=true;log('puzzle-failure');offerHelp()}}

$('records').onclick=records;$('restart').onclick=()=>{const previous=[...$('overlay').childNodes];modal('<h1>네버랜드에서 다시 시작할까요?</h1><p>진행 중인 이야기는 처음으로 돌아갑니다. 엔딩 기록은 남습니다.</p><button id="yes">재시작</button><button id="no">계속 플레이</button>');$('yes').onclick=newGame;$('no').onclick=()=>$('overlay').replaceChildren(...previous)};newGame();if(typeof ResizeObserver!=='undefined'){const dialogueObserver=new ResizeObserver(entries=>{const height=entries[0].contentRect.height;const dialog=document.querySelector('.dialog');$('stage').style.setProperty('--dialog-space',(dialog.getBoundingClientRect().height+45)+'px')});dialogueObserver.observe(document.querySelector('.dialog'))}
